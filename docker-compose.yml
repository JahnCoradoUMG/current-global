services:
  postgres:
    image: postgres:16-alpine
    container_name: current-global-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: current
      POSTGRES_PASSWORD: current
      POSTGRES_DB: current_global
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U current -d current_global"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
