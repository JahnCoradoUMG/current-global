# Monorepo npm. Render construye desde la raíz para que los workspaces resuelvan.
# El plan free no ejecuta preDeployCommand; la migración corre en el arranque, antes de escuchar.
services:
  - type: web
    name: current-global-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build -w api
    startCommand: npm run prisma:deploy -w api && npm run start:prod -w api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: current-global-db
          property: connectionString

databases:
  - name: current-global-db
    plan: free
    databaseName: current_global
    user: current
    postgresMajorVersion: "16"
